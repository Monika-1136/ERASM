version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: erasm-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: erasm_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - erasm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  erasm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erasm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/erasm_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erasm-network

networks:
  erasm-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
