name: ERASM CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run mvn clean verify (includes unit tests)
        run: mvn clean verify

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: erasm-app-jar
          path: target/ERASM-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
